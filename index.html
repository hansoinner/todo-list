<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple and modern Todo List application built with HTML, CSS and JavaScript.">
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.json">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="drag.css">
    <link rel="stylesheet" href="history.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="toast.css">
    <link rel="stylesheet" href="data-transfer.css">
    <link rel="stylesheet" href="shortcuts.css">
    <link rel="stylesheet" href="tags.css">
    <link rel="stylesheet" href="pwa.css">
    <link rel="stylesheet" href="due-date.css">
</head>

<body>
    <main class="app">
        <header class="app-header">
            <p class="eyebrow">Simple productivity</p>
            <h1>Todo List</h1>
            <p class="subtitle">Organize your tasks and stay focused.</p>
        </header>

        <section class="todo-card" aria-label="Todo List">
            <section class="stats-dashboard" aria-labelledby="stats-title">
                <div class="stats-heading">
                    <div><p class="section-eyebrow">Overview</p><h2 id="stats-title">Task Statistics</h2></div>
                    <span class="stats-live" aria-hidden="true">Live</span>
                </div>
                <div class="stats-grid">
                    <article class="stat-card"><span class="stat-label">Total tasks</span><strong id="stat-total" class="stat-value">0</strong></article>
                    <article class="stat-card"><span class="stat-label">Active</span><strong id="stat-active" class="stat-value">0</strong></article>
                    <article class="stat-card"><span class="stat-label">Completed</span><strong id="stat-completed" class="stat-value">0</strong></article>
                    <article class="stat-card stat-card-progress"><span class="stat-label">Completion rate</span><strong id="stat-rate" class="stat-value">0%</strong><div class="progress-track" aria-hidden="true"><div id="stat-progress" class="progress-bar"></div></div></article>
                </div>
                <div class="breakdown-grid">
                    <article class="breakdown-card"><div class="breakdown-heading"><h3>By priority</h3><span id="priority-total" class="breakdown-total">0</span></div><div class="breakdown-list"><div class="breakdown-row"><span><span class="breakdown-dot priority-dot-low"></span>Low</span><strong id="stat-low">0</strong></div><div class="breakdown-row"><span><span class="breakdown-dot priority-dot-medium"></span>Medium</span><strong id="stat-medium">0</strong></div><div class="breakdown-row"><span><span class="breakdown-dot priority-dot-high"></span>High</span><strong id="stat-high">0</strong></div></div></article>
                    <article class="breakdown-card"><div class="breakdown-heading"><h3>By category</h3><span id="category-total" class="breakdown-total">0</span></div><div class="breakdown-list"><div class="breakdown-row"><span>General</span><strong id="stat-general">0</strong></div><div class="breakdown-row"><span>Work</span><strong id="stat-work">0</strong></div><div class="breakdown-row"><span>Personal</span><strong id="stat-personal">0</strong></div><div class="breakdown-row"><span>Learning</span><strong id="stat-learning">0</strong></div></div></article>
                </div>
            </section>

            <form id="todo-form" class="todo-form">
                <div class="input-group">
                    <label for="todo-input">Add a task</label>
                    <div class="input-row"><input type="text" id="todo-input" name="todo" placeholder="What needs to be done?" maxlength="100" autocomplete="off" required><button type="submit" class="add-button">Add Task</button></div>
                    <div class="task-options">
                        <div class="select-group"><label for="todo-priority">Priority</label><select id="todo-priority" name="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div>
                        <div class="select-group"><label for="todo-category">Category</label><select id="todo-category" name="category"><option value="general" selected>General</option><option value="work">Work</option><option value="personal">Personal</option><option value="learning">Learning</option></select></div>
                        <div class="date-group"><label for="todo-due-date">Due date</label><input type="date" id="todo-due-date" name="dueDate"></div>
                    </div>
                </div>
            </form>

            <div class="todo-header">
                <div><h2>Your Tasks</h2><p id="task-count" class="task-count">0 tasks remaining</p></div>
                <div class="history-controls" aria-label="Task history"><button id="undo-button" class="history-button" type="button" title="Undo (Ctrl/Cmd + Z)" aria-label="Nothing to undo" disabled>↶</button><button id="redo-button" class="history-button" type="button" title="Redo (Ctrl/Cmd + Y)" aria-label="Nothing to redo" disabled>↷</button></div>
            </div>

            <div class="task-search"><label for="task-search-input">Search tasks</label><input type="search" id="task-search-input" placeholder="Search by task name..." autocomplete="off"></div>
            <div class="advanced-filters">
                <div class="filter-select"><label for="filter-category">Category</label><select id="filter-category"><option value="all">All categories</option><option value="general">General</option><option value="work">Work</option><option value="personal">Personal</option><option value="learning">Learning</option></select></div>
                <div class="filter-select"><label for="filter-priority">Priority</label><select id="filter-priority"><option value="all">All priorities</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
            </div>
            <div class="sort-controls"><div class="sort-select"><label for="task-sort">Sort tasks</label><select id="task-sort"><option value="manual">Custom order</option><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="due-soon">Due date: soonest</option><option value="due-late">Due date: latest</option><option value="priority-high">Priority: high to low</option><option value="priority-low">Priority: low to high</option></select></div></div>
            <div class="todo-controls"><div class="todo-filters" role="group" aria-label="Filter tasks"><button type="button" class="filter-button active" data-filter="all" aria-pressed="true">All</button><button type="button" class="filter-button" data-filter="active" aria-pressed="false">Active</button><button type="button" class="filter-button" data-filter="completed" aria-pressed="false">Completed</button></div><button type="button" class="clear-completed">Clear completed</button></div>
            <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
        </section>
    </main>

    <script src="toast.js"></script>
    <script src="script.js"></script>
    <script src="edit.js"></script>
    <script src="drag.js"></script>
    <script src="history.js"></script>
    <script src="theme.js"></script>
    <script src="data-transfer.js"></script>
    <script src="shortcuts.js"></script>
    <script src="tags.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
