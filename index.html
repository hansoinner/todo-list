<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple and modern Todo List application built with HTML, CSS and JavaScript.">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="app-header">
            <p class="eyebrow">Simple productivity</p>
            <h1>Todo List</h1>
            <p class="subtitle">Organize your tasks and stay focused.</p>
        </header>

        <section class="todo-card" aria-label="Todo List">

            <form id="todo-form" class="todo-form">
                <div class="input-group">
                    <label for="todo-input">Add a task</label>
                    <div class="input-row">
                        <input type="text" id="todo-input" name="todo" placeholder="What needs to be done?" maxlength="100" autocomplete="off" required>
                        <button type="submit" class="add-button">Add Task</button>
                    </div>
                </div>
            </form>

            <div class="todo-header">
                <div>
                    <h2>Your Tasks</h2>
                    <p id="task-count" class="task-count">0 tasks remaining</p>
                </div>
            </div>

            <div class="todo-controls">
                <div class="todo-filters" role="group" aria-label="Filter tasks">
                    <button type="button" class="filter-button active" data-filter="all" aria-pressed="true">All</button>
                    <button type="button" class="filter-button" data-filter="active" aria-pressed="false">Active</button>
                    <button type="button" class="filter-button" data-filter="completed" aria-pressed="false">Completed</button>
                </div>
                <button type="button" class="clear-completed">Clear completed</button>
            </div>

            <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
